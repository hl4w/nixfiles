name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v26
      with:
        nix_path: nixpkgs=channel:nixos-26.05
        extra_nix_config: |
          experimental-features = nix-command flakes
    - run: nix build .#desktop --no-link
    - run: nix build .#laptop --no-link
    - run: nix build .#server --no-link