name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v26
      with:
        nix_path: nixpkgs=channel:nixos-26.05
        extra_nix_config: |
          experimental-features = nix-command flakes

    # 仓库默认不提交 flake.lock，CI 中先解析并生成锁文件
    - name: Generate flake.lock
      run: nix flake lock

    # 仅求值不构建，尽早暴露 flake 结构、Nix 语法与选项错误
    - name: Check flake
      run: nix flake check --no-build

    # 动态发现 flake.nix 中声明的 nixosConfigurations（由 scripts/install.sh 写入）
    # 全新克隆的仓库该集合为空，此时跳过构建并输出提示，避免误报失败
    - name: Discover host configurations
      id: hosts
      run: |
        hosts="$(nix eval --raw .#nixosConfigurations \
          --apply 'cs: builtins.concatStringsSep " " (builtins.attrNames cs)')"
        echo "hosts=${hosts}" >> "$GITHUB_OUTPUT"
        if [ -z "${hosts}" ]; then
          echo "::warning::flake.nix 未声明 nixosConfigurations，请先运行 scripts/install.sh 生成主机配置后再提交"
        fi

    # nixosConfigurations.<host> 是 NixOS 系统配置，不是 packages 输出，
    # 必须构建完整属性路径 config.system.build.toplevel
    - name: Build host configurations
      if: steps.hosts.outputs.hosts != ''
      run: |
        set -euo pipefail
        for host in ${{ steps.hosts.outputs.hosts }}; do
          echo "::group::Building ${host}"
          nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" --no-link
          echo "::endgroup::"
        done
